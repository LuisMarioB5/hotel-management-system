<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hotel Hodelpa</title>
    <link rel="stylesheet" href="../styles/login.css">
    <!-- Incluye SweetAlert2 desde la CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="logo-section">
                <img src="../assets/login-img.jpeg" alt="Logo del hotel Hodelpa" class="logo-image">
            </div>
            <div class="form-section">
                <h1>Bienvenido</h1>
                <form>
                    <input type="text" id="username" placeholder="Nombre de usuario" required>
                    <input type="password" id="password" placeholder="•••••••••" required>
                    <button id="btn" type="submit">Ingresar</button>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </form>
                <div class="footer">
                    Todos los derechos reservados &copy;
                </div>
            </div>
        </div>
    </div>

    <script src="../validations/login-form.js"></script>
    <script type="module" src="../integrations/login-integration.js"></script>
</body>
</html>
