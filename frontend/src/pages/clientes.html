<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenimiento - Clientes | Hotel Hodelpa</title>
  <link rel="shortcut icon" href="../../public/assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../styles/dashboard.css">
  <link rel="stylesheet" href="../styles/usuarios.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> 
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.all.min.js"></script>
  <script defer src="https://kit.fontawesome.com/a076d05399.js"></script>
</head>
<body>
    <div class="dashboard-page">
        <div class="dashboard-container">
            <div class="main-content">
                <div class="user-info">
                    <button id="logoutButton">Admin <i class="fas fa-user"></i></button>
                </div>
                <div class="contenido">
                    <div class="user-list-header">
                        <h2>Lista de Clientes</h2>
                    </div>
            
                    <!-- Botón "Crear Nuevo" y opciones de visualización -->
                    <div class="user-actions">
                        <button class="create-button" data-toggle="modal" data-target="#createUserModal">
                            <i class="fas fa-user-plus"></i> Nuevo
                        </button>
                        
                        <div class="table-controls">
                            <label for="recordsPerPage">Mostrar:</label>
                            <select id="recordsPerPage">
                                <option value="All">Todos</option>
                                <option value="5">5</option>
                                <option value="10">10</option>
                            </select>
                            <label>Registros:</label>
            
                            <input type="text" id="searchUser" placeholder="Buscar Cliente">
                        </div>
                    </div>

                    <!-- Tabla de Usuarios -->
                    <div class="user-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>Tipo Documento</th>
                                    <th># Documento</th>
                                    <th>Nombre</th>
                                    <th>Apellido</th>
                                    <th>Telefono</th>
                                    <th>Sexo</th>
                                    <th>Correo</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                             <!-- Se llena solo  -->
                            </tbody>
                        </table>
                        <!-- Div de paginación y conteo de registros -->
                        <div class="pagination-info">
                            <label></label>
                            <div class="pagination-buttons">
                                <button class="pagination-btn">&lt;</button>
                                <button class="pagination-btn">&gt;</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Crear Cliente -->
    <div id="createUserModal" class="modalusu">
        <div class="modalusu-content">
            <div class="modalusu-header">
                <h2>Cliente</h2>
                <span class="close-buttonusu" onclick="closeModal()">&times;</span>
            </div>
            <div class="modalusu-body">
                <label for="tipo">Tipo Documento</label>
                <select id="tipo">
                    <option value="CEDULA">CEDULA</option>
                    <option value="DNI">DNI</option>
                    <option value="PASAPORTE">PASAPORTE</option>
                </select>

                <label for="documento"># Documento</label>
                <input type="text" id="documento" required placeholder="Ingrese Documento">

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" required placeholder="Ingrese Nombre">

                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" required placeholder="Ingrese Apellido">

                <label for="telefono">Telefono</label>
                <input type="text" id="telefono" required placeholder="Ingrese Telefono">

                <label for="sexo">Sexo</label>
                <select id="sexo">
                    <option value="masculino">Masculino</option>
                    <option value="femenino">Femenino</option>
                </select>

                <label for="correo">Correo</label>
                <input type="email" id="correo" required placeholder="Ingrese correo">

                <label for="estado">Estado</label>
                <select id="estado">
                    <option value="Activo">Activo</option>
                    <option value="Inactivo">Inactivo</option>
                </select>
            </div>
            <div class="modalusu-footer">
                <button class="btn_cancelusu" onclick="closeModal()">Cerrar</button>
                <button class="btn_saveusu" onclick="guardarCliente()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        // Abrir modal
        document.querySelectorAll('.create-button, .edit-btn').forEach(button => {
            button.addEventListener('click', function() {
                document.getElementById('createUserModal').style.display = 'flex';
            });
        });
   
       // Cerrar modal y limpiar campos
       function closeModal() {
           document.getElementById('createUserModal').style.display = 'none';
           limpiarCampos();
       }
   
       // Función para limpiar los campos del modal(creacion cliente)
       function limpiarCampos() {
           document.getElementById('tipo').selectedIndex = 0;
           document.getElementById('documento').value = '';
           document.getElementById('nombre').value = '';
           document.getElementById('apellido').value = '';
           document.getElementById('correo').value = '';
           document.getElementById('estado').selectedIndex = 0;
       }
   
       // funcion para Validar campos y guardar Cliente
       function guardarCliente() {
            // Obtener los valores de los campos
           const tipo = document.getElementById('tipo').value;
           const documento = document.getElementById('documento').value.trim();
           const nombre = document.getElementById('nombre').value.trim();
           const apellido = document.getElementById('apellido').value.trim();
           const correo = document.getElementById('correo').value.trim();
   
           // Validar los campos
           let mensajeError = '';
           
           if (!documento) {
               mensajeError += 'El # Documento es obligatorio.\n';
           }
   
           if (!nombre) {
               mensajeError += 'El campo Nombre es obligatorio.\n';
           } else if (!/^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/.test(nombre)) {
               mensajeError += 'El Nombre solo debe contener letras.\n';
           }
   
           if (!apellido) {
               mensajeError += 'El campo Apellido es obligatorio.\n';
           } else if (!/^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/.test(apellido)) {
               mensajeError += 'El Apellido solo debe contener letras.\n';
           }
   
           if (!correo) {
               mensajeError += 'El campo Correo es obligatorio.\n';
           } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) {
               mensajeError += 'Ingrese un correo válido.\n';
           }
   
           // Si hay errores, mostrar el mensaje de error
           if (mensajeError) {
               alert(mensajeError);
           } else {
               // Si todos los campos son válidos, guardar el cliente
               alert("Cliente guardado con éxito.");
               closeModal();
           }
       }
   </script>

     <!-- Modal de Logout -->
     <div class="modal" id="logoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5>¿Estás seguro de que deseas salir?</h5>
                <span class="close-button" id="closeModal">&times;</span>
            </div>
            <div class="modal-body">
                Presiona "Cerrar sesión" si estás listo para terminar tu sesión actual.
            </div>
            <div class="modal-footer">
                <button class="btn cancel" id="cancelLogout">Cancelar</button>
                <a href="../pages/login.html" class="btn logout">Cerrar sesión</a>
            </div>
        </div>
    </div>

    <script src="../scripts/CosasComunes.js" type="module"></script>
    <script src="../scripts/cliente.js" type="module"></script>
</body>
</html>
