<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas - Cuestionario | Hotel Hodelpa</title>
    <link rel="shortcut icon" href="../../public/assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../styles/dashboard.css">
    <link rel="stylesheet" href="../styles/G_recepcion_ocup_dispo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.all.min.js"></script>
    <script defer src="https://kit.fontawesome.com/a076d05399.js"></script>
    <!-- CSS embebido para los checkboxes -->
    <style>
        /* Estilo para los checkboxes de preferencias */
        .amenities-container {
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .preference-level-checkboxes {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .preference-level-checkboxes input[type="checkbox"] {
            margin: 0;
        }

        .preference-level-checkboxes label {
            margin-right: 5px;
        }
        .amenity-category {
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
    
        .amenity-category h3 {
            font-size: 0.8rem;
            color: #333;
            margin-bottom: 10px;
        }
    
        .amenity-option {
            margin-bottom: 8px;
            cursor: pointer;
            padding: 5px;
            background-color: #f9f9f9;
            border-radius: 5px;
        }
    
        .amenity-option:hover {
            background-color: #f0f0f0;
        }
    
        .amenity-option .option-label {
            font-size: 0.7rem;
            color: #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    
        .amenity-option .option-label .toggle-icon {
            transition: transform 0.3s ease;
        }
    
        .amenity-option .option-label .toggle-icon.open {
            transform: rotate(180deg);
        }
    
        .amenity-suboptions {
            display: none;
            padding-left: 20px;
            margin-top: 5px;
        }
    
        .amenity-suboptions.open {
            display: block;
        }
    
        .suboption {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }
    
        .suboption label {
            font-size: 0.8rem;
            color: #555;
            flex: 1;
        }
    
        .suboption input[type="checkbox"] {
            cursor: pointer;
        }
    
        .preference-level-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }
    
        .preference-level-container select {
            padding: 5px;
            font-size: 0.8rem;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
        }
    
        @media (max-width: 768px) {
            .suboption {
                flex-direction: column;
                align-items: flex-start;
            }
    
            .preference-level-container {
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-page">
        <div class="dashboard-container">
            <div class="main-content">
                <div class="user-info">
                    <button id="logoutButton">Admin <i class="fas fa-user"></i></button>
                </div>
                <!-- Detalles de la Habitación -->
                <div class="info-card">
                    <input type="hidden" id="cliente-id" name="cliente-id">
                    <input type="hidden" id="nroDocumento" name="nroDocumento">
                    <select id="tipo" style="display: none;">
                        <option value="CEDULA">Cedula</option>
                        <option value="DNI">DNI</option>
                        <option value="PASAPORTE">Pasaporte</option>
                    </select>
                    <select id="sexo" style="display: none;">
                        <option value="MASCULINO">Masculino</option>
                        <option value="FEMENINO">Femenino</option>
                    </select>
                    <h2><i class="fas fa-id-card"></i> Detalle Cliente</h2>                       
                    <div class="info-grid">
                        <div class="info-group">
                            <label><i class="fas fa-user"></i> Nombre:</label>
                            <input type="text" id="nombre" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-users"></i> Apellido:</label>
                            <input type="text" id="apellido" readonly>
                        </div>        
                        <div class="info-group">
                            <label><i class="fas fa-phone"></i> Telefono:</label>
                            <input type="text" id="telefono" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-envelope"></i> Correo:</label>
                            <input type="email" id="correo" readonly>
                        </div>
                        <div class="search-container"> 
                            <button class="search-btn" data-toggle="modal" data-target="#createUserModal"><i class="fas fa-search"></i> Buscar</button>
                        </div>
                    </div>
                </div>

                <!-- Preferencias de Habitación -->
                <div class="reservation-details-card">
                    <div class="client-details">
                        <h2><i class="fas fa-bed"></i> Preferencias de Habitación</h2>
                        <div class="form-group">
                            <label><i class="fas fa-hand-holding-usd"></i> Rango de Precio por Noche</label>
                            <div style="display: flex; gap: 10px;">
                                <div style="flex: 1;">
                                    <label for="min_price">Precio Mínimo:</label>
                                    <select id="min_price" name="min_price">
                                        <!-- Las opciones se cargarán dinámicamente -->
                                    </select>
                                </div>
                                <div style="flex: 1;">
                                    <label for="max_price">Precio Máximo:</label>
                                    <select id="max_price" name="max_price">
                                        <!-- Las opciones se cargarán dinámicamente -->
                                    </select>
                                </div>
                            </div>
                            <div class="suboption" style="margin-top: 10px;">
                                <label>¿Qué tan importante es el rango de precios? (1-5)</label>
                                <div class="preference-level-checkboxes">
                                    <input type="checkbox" id="price_weight_1" name="price_weight_level" value="1">
                                    <label for="price_weight_1">1</label>
                                    <input type="checkbox" id="price_weight_2" name="price_weight_level" value="2">
                                    <label for="price_weight_2">2</label>
                                    <input type="checkbox" id="price_weight_3" name="price_weight_level" value="3">
                                    <label for="price_weight_3">3</label>
                                    <input type="checkbox" id="price_weight_4" name="price_weight_level" value="4">
                                    <label for="price_weight_4">4</label>
                                    <input type="checkbox" id="price_weight_5" name="price_weight_level" value="5">
                                    <label for="price_weight_5">5</label>
                                </div>
                            </div>
                        </div>

                        <!-- Sección de Amenidades (Checkboxes Dinámicos) -->
                        <div class="amenities-container" id="amenities-container">
                            <!-- Las amenidades se cargarán aquí dinámicamente -->
                        </div>

                        <div class="form-actions">
                            <button id="registrarBtn" class="register-btn"><i class="fas fa-save"></i> Guardar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../scripts/clientemodalreserva.js"></script>
    <script src="../scripts/cuestionario.js"></script>

    <!-- Modal de Logout -->
    <div class="modal" id="logoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5>¿Estás seguro de que deseas salir?</h5>
                <span class="close-button" id="closeModal">×</span>
            </div>
            <div class="modal-body">
                Presiona "Cerrar sesión" si estás listo para terminar tu sesión actual.
            </div>
            <div class="modal-footer">
                <button class="btn cancel" id="cancelLogout">Cancelar</button>
                <a href="../pages/login.html" class="btn logout">Cerrar sesión</a>
            </div>
        </div>
    </div>

    <!-- MODAL De lista de clientes -->
    <div class="climodal" id="createUserModal">
        <div class="climodal-content">
            <div class="climodal-header">
                <h2>Lista de Clientes</h2>
                <span class="cliclose-button" onclick="closeModal()">×</span>
            </div>
            <div class="user-actions">
                <div class="table-controls">
                    <label for="recordsPerPage">Mostrar:</label>
                    <select id="recordsPerPage">
                        <option value="10">10</option>
                        <option value="15">15</option>
                    </select>
                    <label>Registros:</label>
                    <input type="text" id="searchUser" placeholder="Buscar cliente">
                </div>
            </div>
            <div class="table-container">
                <table class="service-table">
                    <thead>
                        <tr>
                            <th>Tipo Documento</th>
                            <th># Documento</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Telefono</th>
                            <th>Correo</th>    
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <div class="pagination-info">
                    <label></label>
                    <div class="pagination-buttons">
                        <button class="pagination-btn"><</button>
                        <button class="pagination-btn">></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Abrir modal
        document.querySelector('.search-btn').addEventListener('click', function() {
            document.getElementById('createUserModal').style.display = 'flex';
        });

        // Cerrar modal
        function closeModal() {
            document.getElementById('createUserModal').style.display = 'none';
        }

        // Cerrar modal al hacer clic fuera de él
        window.addEventListener('click', function(event) {
            if (event.target === createUserModal) {
                createUserModal.style.display = 'none';
            }
        });
    </script>

    <script type="module" src="../scripts/CosasComunes.js"></script>
</body>
</html>
