<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas - Cuestionario | Hotel Hodelpa</title>
    <link rel="shortcut icon" href="../../public/assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../styles/dashboard.css">
    <link rel="stylesheet" href="../styles/G_recepcion_ocup_dispo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.all.min.js"></script>
    <script defer src="https://kit.fontawesome.com/a076d05399.js"></script>
<!-- CSS embebido para los checkboxes -->
<style>
    /* Estilo para los checkboxes de preferencias */
    .preference-level-container {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-left: 10px;
    }

    .preference-level-container label {
        display: flex;
        align-items: center;
        gap: 3px;
        font-size: 0.8rem;
        color: #333;
        cursor: pointer;
    }

    .preference-level-container input[type="radio"] {
        margin: 0;
        cursor: pointer;
    }



    @media (max-width: 768px) {
        .form-group {
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        .form-group select {
            width: 100%;
            max-width: none;
        }

        .preference-level-container {
            margin-left: 0;
            margin-top: 5px;
        }
    }
</style>
</head>
<body>
    <div class="dashboard-page">
        <div class="dashboard-container">
            <div class="main-content">
                <div class="user-info">
                    <button id="logoutButton">Admin <i class="fas fa-user"></i></button>
                </div>
                 <!-- Detalles de la Habitación -->
                <div class="info-card">
                    <input type="hidden" id="cliente-id" name="cliente-id">
                    <input type="hidden" id="nroDocumento" name="nroDocumento">
                    <select id="tipo" style="display: none;">
                        <option value="CEDULA">Cedula</option>
                        <option value="DNI">DNI</option>
                        <option value="PASAPORTE">Pasaporte</option>
                    </select>
                    <select id="sexo" style="display: none;">
                        <option value="MASCULINO">Masculino</option>
                        <option value="FEMENINO">Femenino</option>
                    </select>
                    <h2><i class="fas fa-id-card"></i> Detalle Cliente</h2>                       
                    <div class="info-grid">
                        <div class="info-group">
                            <label><i class="fas fa-user"></i> Nombre:</label>
                            <input type="text" id="nombre" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-users"></i> Apellido:</label>
                            <input type="text" id="apellido" readonly>

                        </div>        
                        <div class="info-group">
                            <label><i class="fas fa-phone"></i> Telefono:</label>
                            <input type="text" id="telefono" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-envelope"></i> Correo:</label>
                            <input type="email" id="correo" readonly>
                        </div>
                        <div class="search-container"> 
                            <button class="search-btn" data-toggle="modal" data-target="#createUserModal" ><i class="fas fa-search"></i> Buscar</button>
                        </div>
                    </div>
                   
                    
                </div>

                <!-- Prefefrencias de habitacion -->
                <div class="reservation-details-card">
                    <div class="client-details">
                        <h2><i class="fas fa-bed"></i> Preferencias de Habitación</h2>
                        
                        <div class="form-group">
                            <label for="tipo_habitacion"><i class="fas fa-users"></i> ¿Qué tipo de habitación prefieres?:</label>
                            <select id="tipo_habitacion" name="tipo_habitacion">
                                <option value="INDIVIDUAL">Individual</option>
                                <option value="DOBLE">Doble</option>
                                <option value="TRIPLE">Triple</option>
                                <option value="MATRIMONIAL">Matrimonial</option>
                            </select>
                        </div>
                       
                        <div class="form-group">
                            <label for="rango_precio"><i class="fas fa-hand-holding-usd"></i> ¿Cuál es tu rango de precio por noche?</label>
                            <select id="rango_precio" name="rango_precio">
                                <option value="menos_2000">Menos de RD$2,000</option>
                                <option value="2000_4000">RD$2,000 - RD$4,000</option>
                                <option value="4000_6000">RD$4,000 - RD$6,000</option>
                                <option value="6000_8000">RD$6,000 - RD$8,000</option>
                                <option value="mas_8000">Más de RD$8,000</option>
                            </select>
                        </div>
                     <div class="form-row">   
                        
                        <div class="form-group">
                            <label for="vista"><i class="fas fa-eye"></i> ¿Qué vista te gustaría tener desde tu habitación?</label>
                            <select id="vista" name="vista">
                                <option value="mar">Vista al mar</option>
                                <option value="montaña">Vista a la montaña</option>
                                <option value="piscina">Vista a la piscina</option>
                                <option value="calle">Vista a la calle</option>
                                <option value="interior">Vista interior</option>
                                <option value="no_importa">No importa</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <div class="preference-level-container">
                                <label><input type="radio" name="vista_preference" value="1" checked> 1</label>
                                <label><input type="radio" name="vista_preference" value="2"> 2</label>
                                <label><input type="radio" name="vista_preference" value="3"> 3</label>
                                <label><input type="radio" name="vista_preference" value="4"> 4</label>
                                <label><input type="radio" name="vista_preference" value="5"> 5</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="insonorizacion"><i class="fas fa-volume-up"></i> ¿Qué nivel de insonorización prefieres?</label>
                            <select id="insonorizacion" name="insonorizacion">
                                <option value="alta">Alta (muy tranquila)</option>
                                <option value="media">Media (algo de ruido)</option>
                                <option value="baja">Baja (no importa el ruido)</option>
                                <option value="no_importa">No importa</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <div class="preference-level-container">
                                <label><input type="radio" name="insonorizacion_preference" value="1" checked> 1</label>
                                <label><input type="radio" name="insonorizacion_preference" value="2"> 2</label>
                                <label><input type="radio" name="insonorizacion_preference" value="3"> 3</label>
                                <label><input type="radio" name="insonorizacion_preference" value="4"> 4</label>
                                <label><input type="radio" name="insonorizacion_preference" value="5"> 5</label>
                            </div>
                        </div>

                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="tv"><i class="fas fa-tv"></i> ¿Qué tamaño de TV prefieres?</label> 
                            <select id="tv" name="tv"> 
                                <option value="32">32"</option>
                                <option value="43">43"</option>
                                <option value="55">55"</option>
                                <option value="65">65"</option>
                                <option value="70">70"</option>
                                <option value="indiferente">Indiferente</option>
                            </select> 
                        </div>
                        <div class="form-group">
                            <div class="preference-level-container">
                                <label><input type="radio" name="tv_preference" value="1" checked> 1</label>
                                <label><input type="radio" name="tv_preference" value="2"> 2</label>
                                <label><input type="radio" name="tv_preference" value="3"> 3</label>
                                <label><input type="radio" name="tv_preference" value="4"> 4</label>
                                <label><input type="radio" name="tv_preference" value="5"> 5</label>
                            </div>
                        </div>
                    </div>
                </div>
                    <div class="reservation-details">
                        <h2><i class="fas fa-calendar-alt"></i> Detalle de servicios</h2>
                        
                        <div class="form-row"> 
                            <div class="form-group"> 
                                <label for="wifi"><i class="fas fa-wifi"></i> ¿Te gustaría tener WiFi premium?:</label> 
                                <select id="wifi" name="wifi"> 
                                    <option value="si">Sí</option>
                                    <option value="no">No</option>
                                    <option value="indiferente">Indiferente</option>
                                </select> 

                             
                                    <div class="preference-level-container">
                                        <label><input type="radio" name="wifi_preference" value="1" checked> 1</label>
                                        <label><input type="radio" name="wifi_preference" value="2"> 2</label>
                                        <label><input type="radio" name="wifi_preference" value="3"> 3</label>
                                        <label><input type="radio" name="wifi_preference" value="4"> 4</label>
                                        <label><input type="radio" name="wifi_preference" value="5"> 5</label>
                                    </div>
                              <br>
                            </div>
                        

                            <div class="form-group">
                                <label for="balcon"><i class="fas fa-door-open"></i> ¿Te gustaría tener un balcón privado?:</label>
                                <select id="balcon" name="balcon"> 
                                    <option value="si">Sí</option>
                                    <option value="no">No</option>
                                    <option value="indiferente">Indiferente</option>
                                </select> 

                                <div class="preference-level-container">
                                    <label><input type="radio" name="balcon_preference" value="1" checked> 1</label>
                                    <label><input type="radio" name="balcon_preference" value="2"> 2</label>
                                    <label><input type="radio" name="balcon_preference" value="3"> 3</label>
                                    <label><input type="radio" name="balcon_preference" value="4"> 4</label>
                                    <label><input type="radio" name="balcon_preference" value="5"> 5</label>
                                </div>
                                <br>
                            </div>
                           
                        </div>
                        <div class="form-row">
            
                            <div class="form-group">
                                <label for="jacuzzi"><i class="fas fa-bath"></i> ¿Te gustaría tener un jacuzzi en la habitación?:</label>
                                <select id="jacuzzi" name="jacuzzi"> 
                                    <option value="si">Sí</option>
                                    <option value="no">No</option>
                                    <option value="indiferente">Indiferente</option>
                                </select> 
                                <div class="preference-level-container">
                                    <label><input type="radio" name="jacuzzi_preference" value="1" checked> 1</label>
                                    <label><input type="radio" name="jacuzzi_preference" value="2"> 2</label>
                                    <label><input type="radio" name="jacuzzi_preference" value="3"> 3</label>
                                    <label><input type="radio" name="jacuzzi_preference" value="4"> 4</label>
                                    <label><input type="radio" name="jacuzzi_preference" value="5"> 5</label>
                                </div>
                                <br>
                            </div>
                            <div class="form-group">
                                <label for="minibar"><i class="fas fa-cocktail"></i> ¿Te gustaría tener un minibar gourmet?:</label>
                                <select id="minibar" name="minibar"> 
                                    <option value="si">Sí</option>
                                    <option value="no">No</option>
                                    <option value="indiferente">Indiferente</option>
                                </select> 
                                <div class="preference-level-container">
                                    <label><input type="radio" name="minibar_preference" value="1" checked> 1</label>
                                    <label><input type="radio" name="minibar_preference" value="2"> 2</label>
                                    <label><input type="radio" name="minibar_preference" value="3"> 3</label>
                                    <label><input type="radio" name="minibar_preference" value="4"> 4</label>
                                    <label><input type="radio" name="minibar_preference" value="5"> 5</label>
                                </div>
                                <br>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="desayuno"><i class="fas fa-coffee"></i> ¿Qué tipo de desayuno prefieres?:</label>
                                <select id="desayuno" name="desayuno"> 
                                    <option value="continental">Continental</option>
                                    <option value="buffet">Buffet</option>
                                    <option value="vegano">Vegano</option>
                                    <option value="sin_desayuno">Sin desayuno</option>
                                    <option value="indiferente">Indiferente</option>
                                </select> 
                                <div class="preference-level-container">
                                    <label><input type="radio" name="desayuno_preference" value="1" checked> 1</label>
                                    <label><input type="radio" name="desayuno_preference" value="2"> 2</label>
                                    <label><input type="radio" name="desayuno_preference" value="3"> 3</label>
                                    <label><input type="radio" name="desayuno_preference" value="4"> 4</label>
                                    <label><input type="radio" name="desayuno_preference" value="5"> 5</label>
                                </div>
                                <br>
                            </div>

                            <div class="form-group">
                                <label for="aire_acondicionado"><i class="fas fa-snowflake"></i> ¿Prefieres una habitación con aire acondicionado?:</label>
                                <select id="aire_acondicionado" name="aire_acondicionado"> 
                                    <option value="si">Sí</option>
                                    <option value="no">No</option>
                                    <option value="indiferente">Indiferente</option>
                                </select> 
                                <div class="preference-level-container">
                                    <label><input type="radio" name="aire_acondicionado_preference" value="1" checked> 1</label>
                                    <label><input type="radio" name="aire_acondicionado_preference" value="2"> 2</label>
                                    <label><input type="radio" name="aire_acondicionado_preference" value="3"> 3</label>
                                    <label><input type="radio" name="aire_acondicionado_preference" value="4"> 4</label>
                                    <label><input type="radio" name="aire_acondicionado_preference" value="5"> 5</label>
                                </div>
                                <br>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="ubicacion_piso"><i class="fas fa-map-marker-alt"></i> ¿Tienes alguna preferencia sobre la ubicación de la habitación en el piso?:</label>
                                <select id="ubicacion_piso" name="ubicacion_piso"> 
                                    <option value="cerca_ascensor">Cerca del ascensor</option>
                                    <option value="final_pasillo">Al final del pasillo</option>
                                    <option value="centro">En el centro</option>
                                    <option value="no_importa">No importa</option>
                                </select> 
                            </div>

                            <div class="form-group">
                                <label for="decoracion"><i class="fas fa-home"></i> ¿Tienes alguna preferencia sobre el estilo de decoración?:</label>
                                <select id="decoracion" name="decoracion"> 
                                    <option value="moderna">Moderna</option>
                                    <option value="clasica">Clásica</option>
                                    <option value="minimalista">Minimalista</option>
                                    <option value="no_importa">No importa</option>
                                </select> 
                            </div>
                        </div>

                        <div class="form-group">
                            <label><i class="fas fa-comment-alt"></i> Observación:</label>
                            <textarea id="observacion" rows="3" placeholder="Ingrese observaciones"></textarea>
                        </div>
                        <div class="form-actions">
                            <button id="registrarBtn" class="register-btn"><i class="fas fa-save"></i> Guardar</button>
                        </div>
                    </div>
                </div>    
            </div>
        </div>
    </div>

       
    <script type="module" src="../scripts/clientemodalreserva.js"></script>
    <script src="../scripts/cuestionario.js"></script>
  
    <!-- Modal de Logout -->
    <div class="modal" id="logoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5>¿Estás seguro de que deseas salir?</h5>
                <span class="close-button" id="closeModal">&times;</span>
            </div>
            <div class="modal-body">
                Presiona "Cerrar sesión" si estás listo para terminar tu sesión actual.
            </div>
            <div class="modal-footer">
                <button class="btn cancel" id="cancelLogout">Cancelar</button>
                <a href="../pages/login.html" class="btn logout">Cerrar sesión</a>
            </div>
        </div>
    </div>

    <!--MODAL De lista de clientes-->
    <div class="climodal" id="createUserModal">
        <div class="climodal-content">
            <div class="climodal-header">
                <h2>Lista de Clientes</h2>
                <span class="cliclose-button" onclick="closeModal()">&times;</span>
            </div>

            <div class="user-actions">
                <div class="table-controls">
                    <label for="recordsPerPage">Mostrar:</label>
                    <select id="recordsPerPage">
                        <option value="10">10</option>
                        <option value="15">15</option>
                    </select>
                    <label>Registros:</label>
                    <input type="text" id="searchUser" placeholder="Buscar cliente">
                </div>
            </div>
            <div class="table-container">
                <table class="service-table">
                    <thead>
                        <tr>
                            <th>Tipo Documento</th>
                            <th># Documento</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Telefono</th>
                            <th>Correo</th>    
                        </tr>
                    </thead>
                    <tbody>
                        
                     </tbody>
                </table>
                    <!-- Div de paginación y conteo de registros -->
                <div class="pagination-info">
                    <label></label>
                    <div class="pagination-buttons">
                        <button class="pagination-btn">&lt;</button>
                        <button class="pagination-btn">&gt;</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--Fin -->
    <script>
        // Abrir modal
       document.querySelector('.search-btn').addEventListener('click', function() {
           document.getElementById('createUserModal').style.display = 'flex';
       });
   
       // Cerrar modal
       function closeModal() {
           document.getElementById('createUserModal').style.display = 'none';
       }

       // Cerrar modal al hacer clic fuera de él
       window.addEventListener('click', function(event) {
            if (event.target === createUserModal) {
                createUserModal.style.display = 'none';
            }
        });
    </script>

    <script type="module" src="../scripts/CosasComunes.js"></script>
</body>
</html>
