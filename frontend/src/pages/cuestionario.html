<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas - Cuestionario | Hotel Hodelpa</title>
    <link rel="shortcut icon" href="../../public/assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../styles/dashboard.css">
    <link rel="stylesheet" href="../styles/recepcion.css">
    <link rel="stylesheet" href="../styles/G_recepcion_ocup_dispo.css">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.all.min.js"></script>
    
</head>
<body>
    <div class="dashboard-page">
        <div class="dashboard-container">
            <div class="main-content">
                <div class="user-info">
                    <div id="logoutButton" class="profile-card" role="button" tabindex="0">
                        <i class="fas fa-user"></i>
                        <span class="profile-name">Admin</span>
                        <i class="fas profile-role-icon"></i>
                        <i class="fas fa-chevron-down profile-chevron"></i>
                    </div>
                </div>
                <div class="cuestionario-form">
                <!-- Detalle Cliente -->
                <div class="panel-card">
                    <input type="hidden" id="cliente-id" name="cliente-id">
                    <input type="hidden" id="nroDocumento" name="nroDocumento">
                    <select id="tipo" style="display: none;">
                        <option value="CEDULA">Cedula</option>
                        <option value="DNI">DNI</option>
                        <option value="PASAPORTE">Pasaporte</option>
                    </select>
                    <select id="sexo" style="display: none;">
                        <option value="MASCULINO">Masculino</option>
                        <option value="FEMENINO">Femenino</option>
                    </select>
                    <div class="panel-card-header">
                        <h3 class="panel-card-title">Detalle Cliente</h3>
                    </div>
                    <div class="panel-form-grid panel-form-grid-tight">
                        <div class="panel-field">
                            <div class="panel-icon-box"><i class="fas fa-user"></i></div>
                            <div class="panel-field-body">
                                <label for="nombre">Nombre</label>
                                <input type="text" id="nombre" readonly>
                            </div>
                        </div>
                        <div class="panel-field">
                            <div class="panel-icon-box"><i class="fas fa-users"></i></div>
                            <div class="panel-field-body">
                                <label for="apellido">Apellido</label>
                                <input type="text" id="apellido" readonly>
                            </div>
                        </div>
                        <div class="panel-field">
                            <div class="panel-icon-box"><i class="fas fa-phone"></i></div>
                            <div class="panel-field-body">
                                <label for="telefono">Teléfono</label>
                                <input type="text" id="telefono" readonly>
                            </div>
                        </div>
                        <div class="panel-field">
                            <div class="panel-icon-box"><i class="fas fa-envelope"></i></div>
                            <div class="panel-field-body">
                                <label for="correo">Correo</label>
                                <input type="email" id="correo" readonly>
                            </div>
                        </div>
                    </div>
                    <div class="panel-form-actions">
                        <button type="button" class="panel-btn-gradient panel-btn-sm search-btn" data-toggle="modal" data-target="#createUserModal"><i class="fas fa-search"></i> Buscar</button>
                    </div>
                </div>

                <!-- Preferencias de Habitación -->
                <div class="panel-card">
                    <div class="panel-card-header">
                        <h3 class="panel-card-title">Preferencias de Habitación</h3>
                    </div>
                    <div class="panel-form-grid panel-form-grid-tight">
                        <div class="panel-field">
                            <div class="panel-icon-box"><i class="fas fa-hand-holding-usd"></i></div>
                            <div class="panel-field-body">
                                <label for="min_price">Precio Mínimo</label>
                                <select id="min_price" name="min_price">
                                    <!-- Las opciones se cargarán dinámicamente -->
                                </select>
                            </div>
                        </div>
                        <div class="panel-field">
                            <div class="panel-icon-box"><i class="fas fa-hand-holding-usd"></i></div>
                            <div class="panel-field-body">
                                <label for="max_price">Precio Máximo</label>
                                <select id="max_price" name="max_price">
                                    <!-- Las opciones se cargarán dinámicamente -->
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="suboption cuestionario-weight" style="margin-top: 16px;">
                        <label>¿Qué tan importante es el rango de precios? (1-5)</label>
                        <div class="preference-level-checkboxes">
                            <input type="checkbox" id="price_weight_1" name="price_weight_level" value="1">
                            <label for="price_weight_1">1</label>
                            <input type="checkbox" id="price_weight_2" name="price_weight_level" value="2">
                            <label for="price_weight_2">2</label>
                            <input type="checkbox" id="price_weight_3" name="price_weight_level" value="3">
                            <label for="price_weight_3">3</label>
                            <input type="checkbox" id="price_weight_4" name="price_weight_level" value="4">
                            <label for="price_weight_4">4</label>
                            <input type="checkbox" id="price_weight_5" name="price_weight_level" value="5">
                            <label for="price_weight_5">5</label>
                        </div>
                    </div>

                    <!-- Sección de Amenidades (Checkboxes Dinámicos) -->
                    <div class="amenities-container" id="amenities-container">
                        <!-- Las amenidades se cargarán aquí dinámicamente -->
                    </div>

                    <div class="panel-form-actions">
                        <button id="registrarBtn" class="panel-btn-gradient"><i class="fas fa-save"></i> Guardar</button>
                    </div>
                </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../scripts/clientemodalreserva.js"></script>
    <script type="module" src="../scripts/cuestionario.js"></script>

    <!-- Modal de Logout -->
    <div class="modal" id="logoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5>¿Estás seguro de que deseas salir?</h5>
                <span class="close-button" id="closeModal">×</span>
            </div>
            <div class="modal-body">
                Presiona "Cerrar sesión" si estás listo para terminar tu sesión actual.
            </div>
            <div class="modal-footer">
                <button class="btn cancel" id="cancelLogout">Cancelar</button>
                <a href="../pages/login.html" class="btn logout">Cerrar sesión</a>
            </div>
        </div>
    </div>

    <!-- MODAL De lista de clientes -->
    <div class="climodal" id="createUserModal">
        <div class="climodal-content">
            <div class="climodal-header">
                <h2>Lista de Clientes</h2>
                <span class="cliclose-button" onclick="closeModal()">×</span>
            </div>
            <div class="user-actions">
                <div class="table-controls">
                    <label for="recordsPerPage">Mostrar:</label>
                    <select id="recordsPerPage">
                        <option value="10">10</option>
                        <option value="15">15</option>
                    </select>
                    <label>Registros:</label>
                    <input type="text" id="searchUser" placeholder="Buscar cliente">
                </div>
            </div>
            <div class="table-container">
                <table class="service-table">
                    <thead>
                        <tr>
                            <th>Tipo Documento</th>
                            <th># Documento</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Telefono</th>
                            <th>Correo</th>    
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <div class="pagination-info">
                    <label></label>
                    <div class="pagination-buttons">
                        <button class="pagination-btn"><</button>
                        <button class="pagination-btn">></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Abrir modal
        document.querySelector('.search-btn').addEventListener('click', function() {
            document.getElementById('createUserModal').style.display = 'flex';
        });

        // Cerrar modal
        function closeModal() {
            document.getElementById('createUserModal').style.display = 'none';
        }

        // Cerrar modal al hacer clic fuera de él
        window.addEventListener('click', function(event) {
            if (event.target === createUserModal) {
                createUserModal.style.display = 'none';
            }
        });
    </script>

    <script type="module" src="../scripts/CosasComunes.js"></script>
</body>
</html>
