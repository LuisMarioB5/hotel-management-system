<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión - Fin Hospedaje | Hotel Hodelpa</title>
    <link rel="shortcut icon" href="../../public/assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../styles/dashboard.css">
    <link rel="stylesheet" href="../styles/G_recepcion_ocup_dispo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.all.min.js"></script>
    <script defer src="https://kit.fontawesome.com/a076d05399.js"></script>
</head>
<body>
    <div class="dashboard-page">
        <div class="dashboard-container">
            <div class="main-content">
                <div class="user-info">
                    <button id="logoutButton">Admin <i class="fas fa-user"></i></button>
                </div>
                <!-- Resumen de la Habitación -->
                <div class="info-card">
                    <h2><i class="fas fa-bed"></i> Resumen de la Habitación</h2>
                    <div class="info-grid">
                        <div class="info-group">
                            <label><i class="fas fa-hashtag"></i> Habitacion:</label>
                            <input type="text" id="roomNumber" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-list"></i> Detalles:</label>
                            <input type="text" id="roomDetails" readonly>
                        </div>        
                        <div class="info-group">
                            <label><i class="fas fa-tag"></i> Categoría:</label>
                            <input type="text" id="roomCategory" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-building"></i> Piso:</label>
                            <input type="text" id="roomFloor" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-user"></i> Cliente:</label>
                            <input type="text" id="clientName" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-id-card"></i> Nro Documento:</label>
                            <input type="text" id="nroDocumento" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-envelope"></i> Correo:</label>
                            <input type="email" id="correo" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-calendar-plus"></i> Fecha Entrada:</label>
                            <input type="date" id="fechaEntrada" readonly>
                        </div>
                    </div>
                </div>

                <!-- Detalle de Hospedaje -->
                <div class="info-card">
                    <h2><i class="fas fa-concierge-bell"></i> Detalle de Hospedaje</h2>
                    <div class="info-grid">
                        <div class="info-group">
                            <label><i class="fas fa-dollar-sign"></i> Costo Total Habitacion:</label>
                            <input type="text" id="roomCost" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-money-bill-wave"></i> Cantidad Adelanto:</label>
                            <input type="text" id="cashAdvance" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-money-bill"></i> Cantidad Restante:</label>
                            <input type="text" id="remainingAmount" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-list"></i> Detalles:</label>
                            <input type="text" id="bookingDetails" readonly>
                        </div> 
                        <div class="info-group">
                            <label><i class="fas fa-exclamation-circle"></i> Costo por penalidad:</label>
                            <input id="penalty" class="cant" type="number" value="0" min="0" oninput="this.value = Math.max(0, this.value)">
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-exclamation-circle"></i> Descripcion de la penalidad:</label>
                            <input id="infoPenality" class="cant" type="text" placeholder="Escriba razon de Penalidad Aqui..." style="cursor: text;">
                        </div>
                    </div>
                </div>

                <!-- Servicio a la Habitación -->
                <div class="info-card">
                    <h2><i class="fas fa-bell"></i> Servicio a la Habitación</h2>
                    <div class="table-container">
                        <table class="service-table">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Cantidad</th>
                                    <th>Precio Unitario</th>
                                    <th>Estado Venta</th>
                                    <th>Sub Total</th>
                                </tr>
                            </thead>
                            <tbody>
                              
                            </tbody>
                        </table>
                        <div class="total-section">
                            <div class="total-label">Total Pagar</div>
                            <div class="total-amount" style="text-align: left;"></div>
                            <button class="finish-sale-btn">Finalizar Hospedaje</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Logout -->
    <div class="modal" id="logoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5>¿Estás seguro de que deseas salir?</h5>
                <span class="close-button" id="closeModal">&times;</span>
            </div>
            <div class="modal-body">
                Presiona "Cerrar sesión" si estás listo para terminar tu sesión actual.
            </div>
            <div class="modal-footer">
                <button class="btn cancel" id="cancelLogout">Cancelar</button>
                <a href="../pages/login.html" class="btn logout">Cerrar sesión</a>
            </div>
        </div>
    </div>

    <script type="module" src="../scripts/CosasComunes.js"></script>

    <script type="module">
        import { initializeRoomCheckOutPage } from '../scripts/consumibles.js';
        document.addEventListener('DOMContentLoaded', initializeRoomCheckOutPage);
    </script>
</body>
</html>
