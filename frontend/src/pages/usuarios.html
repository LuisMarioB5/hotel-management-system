<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Hodelpa | Usuarios</title>
  <link rel="stylesheet" href="../styles/dashboard.css">
  <link rel="stylesheet" href="../styles/usuarios.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <script type="module" src="../auth/pages/dashboardAndReports.auth.js"></script>
</head>
<body>
    <div class="dashboard-page">
        <div class="dashboard-container">
         

            <div class="main-content">
                <div class="user-info">
                    <button id="logoutButton">Admin <i class="fas fa-user"></i></button>
                </div>
                <div class="contenido">
                    <div class="user-list-header">
                        <h2>Lista de Usuarios</h2>
                    </div>
                 
                    <!-- Botón "Crear Nuevo" y opciones de visualización -->
                    <div class="user-actions">
                        <button class="create-button" data-toggle="modal" data-target="#createUserModal">
                            <i class="fas fa-user-plus"></i> Nuevo
                        </button>
                        
                        <div class="table-controls">
                            <label for="recordsPerPage">Mostrar:</label>
                            <select id="recordsPerPage">
                                <option value="All">Todos</option>
                                <option value="5">5</option>
                                <option value="10">10</option>
                            </select>
                            <label>Registros </label>
                            <input type="text" id="searchUser" placeholder="Buscar usuario">
                        </div>
                    </div>

                    <!-- Tabla de Usuarios -->
                    <div class="user-table">
                        <table id="userTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Usuario</th>
                                    <th>Rol</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Los datos se cargarán dinámicamente aquí -->
                            </tbody>
                        </table>
                        <!-- Div de paginación y conteo de registros -->
                        <div class="pagination-info">
                            <label></label>
                            <div class="pagination-buttons">
                                <button class="pagination-btn">&lt;</button>
                                <button class="pagination-btn">&gt;</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal para Crear Usuario -->
    <div id="createUserModal" class="modalusu">
        <div class="modalusu-content">
            <div class="modalusu-header">
                <h2>Usuario</h2>
                <span class="close-buttonusu" onclick="closeModal()">&times;</span>
            </div>
            <div class="modalusu-body">
    
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" required>

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" required>

                <label for="confirmarContrasena">Confirmar Contraseña</label>
                <input type="password" id="confirmarContrasena" required>

                <label for="tipo">Rol</label>   
                <select id="tipo">S
                    <option value="ADMINISTRADOR">ADMINISTRADOR</option>
                    <option value="RECEPCIONISTA">RECEPCIONISTA</option>
                    <option value="MANTENIMIENTO">MANTENIMIENTO</option>
                    <option value="GERENTE">GERENTE</option>
                    <option value="Otro">Otro</option>
                </select>

                <label for="estado">Estado</label>
                <select id="estado">
                    <option value="Activo">Activo</option>
                    <option value="Inactivo">Inactivo</option>
                </select>
            </div>
            <div class="modalusu-footer">
                <button class="btn_cancelusu" onclick="closeModal()">Cerrar</button>
                <button class="btn_saveusu" onclick="guardarUsuario()">Guardar</button>
            </div>
        </div>
    </div>

     <!-- Modal de Logout -->
     <div class="modal" id="logoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5>¿Estás seguro de que deseas salir?</h5>
                <span class="close-button" id="closeModal">&times;</span>
            </div>
            <div class="modal-body">
                Presiona "Cerrar sesión" si estás listo para terminar tu sesión actual.
            </div>
            <div class="modal-footer">
                <button class="btn cancel" id="cancelLogout">Cancelar</button>
                <a href="../pages/login.html" class="btn logout">Cerrar sesión</a>
            </div>
        </div>
    </div>
    

<script>
     // Abrir modal
     document.querySelectorAll('.create-button, .edit-btn').forEach(button => {
            button.addEventListener('click', function() {
                document.getElementById('createUserModal').style.display = 'flex';
            });
        });

    // Cerrar modal y limpiar campos
    function closeModal() {
        document.getElementById('createUserModal').style.display = 'none';
        limpiarCampos();
    }

    // Función para limpiar los campos del modal
    function limpiarCampos() {
        document.getElementById('username').value = '';
        document.getElementById('contrasena').value = '';
        document.getElementById('confirmarContrasena').value = '';
        document.getElementById('tipo').selectedIndex = 0;
        document.getElementById('estado').selectedIndex = 0;
    }

    // Validación de contraseñas y guardar usuario
    function guardarUsuario() {
        const contrasena = document.getElementById('contrasena').value;
        const confirmarContrasena = document.getElementById('confirmarContrasena').value;
        const tipo = document.getElementById('tipo').value;
        const nombre = document.getElementById('username').value.trim();
        const estado = document.getElementById('estado').value;

        // Validar los campos
        let mensajeError = '';

        if (contrasena !== confirmarContrasena) {
            alert("Las contraseñas no coinciden. Por favor, intenta de nuevo.");
            return;
        }

        if (!nombre) {
            mensajeError += 'El campo Usuario es obligatorio.\n';
        } else if (!/^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/.test(nombre)) {
            mensajeError += 'El usuario solo debe contener letras.\n';
        }
        // Si hay errores, mostrar el mensaje de error
        if (mensajeError) {
            alert(mensajeError);
        } else {
            // Si todos los campos son válidos, guardar el Usuario
            alert("Usuario guardado con éxito.");
            closeModal();
        }
    }
</script>
<script type="module" src="../scripts/CosasComunes.js"></script>
<script src="../scripts/usuario.js" type="module"></script>
</body>
</html>
