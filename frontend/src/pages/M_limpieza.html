<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Hodelpa | Limpieza </title>
    <link rel="stylesheet" href="../styles/dashboard.css">
    <link rel="stylesheet" href="../styles/recepcion.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script type="module" src="../auth/pages/maintenance.auth.js"></script>
</head>
<body>
    <div class="dashboard-page">
            <div class="dashboard-container">
                

                <div class="main-content">
                    <div class="user-info">
                        <button id="logoutButton">Admin <i class="fas fa-user"></i></button>
                    </div>
                    <h2>Habitaciones en Limpieza</h2>
                    <hr>

                    <div class="rooms-container">
                        <label>Seleccionar Piso</label>
                        <select class="floor-selector">
                            <option value="Todos">Todos</option>
                            <option value="PRIMER">PRIMER</option>
                            <option value="SEGUNDO">SEGUNDO</option>
                            <option value="TERCER">TERCER</option>
                            <option value="CUARTO">CUARTO</option>
                            <option value="QUINTO">QUINTO</option>
                        </select>

                        <div class="rooms-grid">
                            <!--Se llenara automatico-->
                        </div>
                    </div>
                </div>
            </div>
    </div>

     <!-- Nuevo Modal de Limpieza -->
     <div class="modal" id="limpiezaModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5>¿Confirmar finalización de limpieza?</h5>
                <span class="close-button" id="closeLimpiezaModal">&times;</span>
            </div>
            <div class="modal-body">
                ¿Está seguro que desea dar por terminada la limpieza de la habitación?
            </div>
            <div class="modal-footer">
                <button class="btn cancel" id="cancelLimpieza">Cancelar</button>
                <button class="btn confirm" id="confirmarLimpieza">Confirmar limpieza</button>
            </div>
        </div>
    </div>

    <!-- Modal de Logout -->
    <div class="modal" id="logoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5>¿Estás seguro de que deseas salir?</h5>
                <span class="close-button" id="closeModal">&times;</span>
            </div>
            <div class="modal-body">
                Presiona "Cerrar sesión" si estás listo para terminar tu sesión actual.
            </div>
            <div class="modal-footer">
                <button class="btn cancel" id="cancelLogout">Cancelar</button>
                <a href="../pages/login.html" class="btn logout">Cerrar sesión</a>
            </div>
        </div>
    </div>
   
    <script src="../scripts/CosasComunes.js"></script>

    <script type="module">
        import { initializeCleaningRooms } from '../scripts/habitacion.js';
        document.addEventListener('DOMContentLoaded', initializeCleaningRooms);
    </script>
</body>
</html>
