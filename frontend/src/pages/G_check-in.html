<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión - Hospedaje | Hotel Hodelpa</title>
    <link rel="shortcut icon" href="../../public/assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../styles/dashboard.css">
    <link rel="stylesheet" href="../styles/G_recepcion_ocup_dispo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer src="https://kit.fontawesome.com/a076d05399.js"></script>
</head>
<body>
    <div class="dashboard-page">
        <div class="dashboard-container">
            <div class="main-content">
                <div class="user-info">
                    <button id="logoutButton">Admin <i class="fas fa-user"></i></button>
                </div>
                <!-- Resumen de la Habitación -->
                <div class="info-card" id="reservationDetailsContainer"> </div>       
            </div>
        </div>
    </div>

    <!-- Modal de Logout -->
    <div class="modal" id="logoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5>¿Estás seguro de que deseas salir?</h5>
                <span class="close-button" id="closeModal">&times;</span>
            </div>
            <div class="modal-body">
                Presiona "Cerrar sesión" si estás listo para terminar tu sesión actual.
            </div>
            <div class="modal-footer">
                <button class="btn cancel" id="cancelLogout">Cancelar</button>
                <a href="../pages/login.html" class="btn logout">Cerrar sesión</a>
            </div>
        </div>
    </div>
    
    <script type="module" src="../scripts/CosasComunes.js"></script>
    <script type="module">
        import { initializeCheckInPage } from '../scripts/booking.js';
        document.addEventListener('DOMContentLoaded', initializeCheckInPage);
    </script>
</body>
</html>
