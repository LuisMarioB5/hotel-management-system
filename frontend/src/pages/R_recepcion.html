<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Hodelpa | Reportes</title>
    <link rel="stylesheet" href="../styles/recepcion.css">
    <link rel="stylesheet" href="../styles/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="../auth/pages/dashboardAndReports.auth.js"></script>
    <script type="module" src="../auth/pages/reports.auth.js"></script>
</head>
<body>
    <div class="dashboard-page">
            <div class="dashboard-container">
             

                <div class="main-content">

                <div class="user-info">
                    <button id="logoutButton">Admin <i class="fas fa-user"></i></button>
                </div>
                    <h2>Exportar Reportes</h2>
                    <hr>
                    <div class="rooms-container">
                        <h3 style="color:#007bff">Exportacion de habitacion reservadas</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="room-number"><i class="fas fa-hashtag" style="color: #007bff;"></i> Número Habitación:</label>
                                <select id="room-number">
                                    <option value="all">Todos</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>    
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="start-date"><i class="fas fa-calendar-plus" style="color: #007bff;"></i> Fecha Inicio:</label>
                                <input type="date" id="fechaEntrada" class="date-picker" placeholder="dd/mm/yyyy">
                            </div>
                            <div class="form-group">
                                <label for="end-date"><i class="fas fa-calendar-minus " style="color: #007bff;"></i> Fecha Fin:</label>
                                <input type="date" id="fechaSalida" class="date-picker" placeholder="dd/mm/yyyy">
                            </div>
                            <div class="form-group">
                                <button class="download-btn">
                                    <i class="fas fa-cloud-download-alt"></i> Descargar
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="rooms-container">
                        <h3 style="color: #007bff;">Exportación de Productos/Servicios Ofrecidos</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="status"><i class="fas fa-check-circle" style="color: green;"></i> Estado:</label>
                                <select id="status">
                                    <option value="all">Todos</option>
                                    <option value="activo">Activo</option>
                                    <option value="inactivo">Inactivo</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="category"><i class="fas fa-box" style="color: #007bff;"></i> Categoría:</label>
                                <select id="category">
                                    <option value="all">Todos</option>
                                    <option value="PRODUCTO">Producto</option>
                                    <option value="SERVICIO">Servicio</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <button class="downloadproduct-btn" onclick="downloadProductsReportPDF(document.getElementById('status').value, document.getElementById('category').value)">
                                    <i class="fas fa-cloud-download-alt"></i> Descargar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
  

    <div class="modal" id="logoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5>¿Estás seguro de que deseas salir?</h5>
                <span class="close-button" id="closeModal">&times;</span>
            </div>
            <div class="modal-body">
                Presiona "Cerrar sesión" si estás listo para terminar tu sesión actual.
            </div>
            <div class="modal-footer">
                <button class="btn cancel" id="cancelLogout">Cancelar</button>
                <a href="../pages/login.html" class="btn logout">Cerrar sesión</a>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Establecer la fecha de entrada como la fecha actual
            const fechaEntrada = document.getElementById('fechaEntrada');
            const hoy = new Date().toISOString().split('T')[0];
            fechaEntrada.value = hoy;

            // Establecer la fecha de entrada como la fecha actual
            const fechaSalida = document.getElementById('fechaSalida');
            
            // Set min date for checkout to be today
            const today = new Date().toISOString().split('T')[0];
            fechaSalida.setAttribute('min', today);

            // Update min date for checkout when check-in date changes
            fechaEntrada.addEventListener('change', function() {
                fechaSalida.setAttribute('min', this.value);
                if(fechaSalida.value && fechaSalida.value < this.value) {
                    fechaSalida.value = this.value;
                }
            });
        });
    </script>
  <script src="../scripts/CosasComunes.js" type="module"></script>
    <script src="../scripts/reporte.js" type="module"></script>
</body>
</html>
