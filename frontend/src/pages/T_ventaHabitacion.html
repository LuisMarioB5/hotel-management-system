<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda - Venta a Habitación | Hotel Hodelpa</title>
    <link rel="shortcut icon" href="../../public/assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../styles/dashboard.css">
    <link rel="stylesheet" href="../styles/recepcion.css">
    <link rel="stylesheet" href="../styles/G_recepcion_ocup_dispo.css"> <!--Aqui tambien estaran los estilos de esta pagina-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.all.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.min.css">
</head>
<body>
    <div class="dashboard-page">
        <div class="dashboard-container">
            <div class="main-content">
                <div class="user-info">
                    <div id="logoutButton" class="profile-card" role="button" tabindex="0">
                        <i class="fas fa-user"></i>
                        <span class="profile-name">Admin</span>
                        <i class="fas profile-role-icon"></i>
                        <i class="fas fa-chevron-down profile-chevron"></i>
                    </div>
                </div>

                <div class="venta-form">
                <!-- Resumen de la Habitación -->
                <div class="panel-card">
                    <div class="panel-card-header">
                        <h3 class="panel-card-title">Resumen de la Habitación</h3>
                    </div>
                    <div class="panel-stats-row">
                        <div class="panel-stat">
                            <div class="panel-icon-box panel-stat-icon"><i class="fas fa-hashtag"></i></div>
                            <div class="panel-stat-body">
                                <label for="roomNumber" class="panel-stat-label">Habitación</label>
                                <input type="text" id="roomNumber" class="panel-stat-value" readonly>
                            </div>
                        </div>
                        <div class="panel-stat">
                            <div class="panel-icon-box panel-stat-icon"><i class="fas fa-list"></i></div>
                            <div class="panel-stat-body">
                                <label for="roomDetails" class="panel-stat-label">Detalles</label>
                                <input type="text" id="roomDetails" class="panel-stat-value" readonly>
                            </div>
                        </div>
                        <div class="panel-stat">
                            <div class="panel-icon-box panel-stat-icon"><i class="fas fa-tag"></i></div>
                            <div class="panel-stat-body">
                                <label for="roomCategory" class="panel-stat-label">Categoría</label>
                                <input type="text" id="roomCategory" class="panel-stat-value" readonly>
                            </div>
                        </div>
                        <div class="panel-stat">
                            <div class="panel-icon-box panel-stat-icon"><i class="fas fa-building"></i></div>
                            <div class="panel-stat-body">
                                <label for="roomFloor" class="panel-stat-label">Piso</label>
                                <input type="text" id="roomFloor" class="panel-stat-value" readonly>
                            </div>
                        </div>
                        <div class="panel-stat">
                            <div class="panel-icon-box panel-stat-icon"><i class="fas fa-user"></i></div>
                            <div class="panel-stat-body">
                                <label for="clientName" class="panel-stat-label">Cliente</label>
                                <input type="text" id="clientName" class="panel-stat-value" readonly>
                            </div>
                        </div>
                        <div class="panel-stat">
                            <div class="panel-icon-box panel-stat-icon"><i class="fas fa-id-card"></i></div>
                            <div class="panel-stat-body">
                                <label for="nroDocumento" class="panel-stat-label">Nro Documento</label>
                                <input type="text" id="nroDocumento" class="panel-stat-value" readonly>
                            </div>
                        </div>
                        <div class="panel-stat">
                            <div class="panel-icon-box panel-stat-icon"><i class="fas fa-envelope"></i></div>
                            <div class="panel-stat-body">
                                <label for="correo" class="panel-stat-label">Correo</label>
                                <input type="email" id="correo" class="panel-stat-value" readonly>
                            </div>
                        </div>
                        <div class="panel-stat">
                            <div class="panel-icon-box panel-stat-icon"><i class="fas fa-calendar-plus"></i></div>
                            <div class="panel-stat-body">
                                <label for="fechaEntrada" class="panel-stat-label">Fecha Entrada</label>
                                <input type="date" id="fechaEntrada" class="panel-stat-value" readonly>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Detalle de venta -->
                <div class="panel-card">
                    <div class="panel-card-header">
                        <h3 class="panel-card-title">Detalle de Venta</h3>
                    </div>
                    <input type="hidden" id="idproduct" name="idproduct">
                    <input type="hidden" id="stock" name="stock">
                    <input type="hidden" id="category" name="category">
                    <div class="panel-form-grid panel-form-grid-tight">
                        <div class="panel-field">
                            <div class="panel-icon-box"><i class="fas fa-utensils"></i></div>
                            <div class="panel-field-body">
                                <label for="productSearch">Producto/Servicio</label>
                                <input id="productSearch" class="search-btn" data-toggle="modal" data-target="#createUserModal" type="text" readonly style="cursor: pointer;" placeholder="Presione para buscar">
                            </div>
                        </div>
                        <div class="panel-field">
                            <div class="panel-icon-box"><i class="fas fa-dollar-sign"></i></div>
                            <div class="panel-field-body">
                                <label for="UnitPrice">Precio</label>
                                <input type="text" id="UnitPrice" readonly placeholder="RD$0.00">
                            </div>
                        </div>
                        <div class="panel-field">
                            <div class="panel-icon-box"><i class="fas fa-th-list"></i></div>
                            <div class="panel-field-body">
                                <label for="cantidad">Cantidad</label>
                                <input id="cantidad" class="cant" type="number" value="1" min="1" oninput="this.value = Math.max(1, this.value)">
                            </div>
                        </div>
                    </div>
                    <div class="panel-form-actions">
                        <button id="add-btn" class="panel-btn-gradient panel-btn-sm"><i class="fas fa-plus"></i> Agregar</button>
                    </div>

                    <div class="venta-table-wrap">
                        <table id="bodyProductTable" class="service-table">
                            <thead>
                                <tr>
                                    <th></th>
                                    <th>Producto/Servicio</th>
                                    <th>Cantidad</th>
                                    <th>Precio Unitario</th>
                                    <th>Sub Total</th>
                                </tr>
                            </thead>
                            <tbody id="tablabody"></tbody>
                        </table>
                    </div>
                    <div class="total-section">
                        <div class="total-label">Total Pagar</div>
                        <input class="total-amount" style="width: 60px;" readonly></input>
                    </div>
                    <div class="sale-actions">
                        <div class="sale-status">
                            <label>Estado Venta</label>
                            <select for="estadoV">
                                <option id="PENDIENTE">Pendiente</option>
                                <option id="PAGADO">Pagado</option>
                            </select>
                        </div>
                        <button id="finalize-sale-btn" class="finish-sale-btn panel-btn-gradient"><i class="fas fa-check-circle"></i> Finalizar Venta</button>
                    </div>
                </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../scripts/ventamodalproducto.js"></script>
    
    <!-- Modal de Logout -->
    <div class="modal" id="logoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5>¿Estás seguro de que deseas salir?</h5>
                <span class="close-button" id="closeModal">&times;</span>
            </div>
            <div class="modal-body">
                Presiona "Cerrar sesión" si estás listo para terminar tu sesión actual.
            </div>
            <div class="modal-footer">
                <button class="btn cancel" id="cancelLogout">Cancelar</button>
                <a href="../pages/login.html" class="btn logout">Cerrar sesión</a>
            </div>
        </div>
    </div>
    
    <!--MODAL De lista de clientes-->
    <div class="climodal" id="createUserModal">
        <div class="climodal-content">
            <div class="climodal-header">
                <h2>Lista de Productos</h2>
                <span class="cliclose-button" onclick="closeModal()">&times;</span>
            </div>

            <div class="user-actions">
                <div class="table-controls">
                    <label for="recordsPerPage">Mostrar:</label>
                    <select id="recordsPerPage">
                        <option value="10">10</option>
                        <option value="15">15</option>
                    </select>
                    <label>Registros:</label>
                    <input type="text" id="searchUser" placeholder="Buscar Producto">
                </div>
            </div>

            <div class="table-container">
                <table id="modalProductTable"  class="service-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Categoria</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                     </tbody>
                </table>
                    <!-- Div de paginación y conteo de registros -->
                <div class="pagination-info">
                    <label></label>
                    <div class="pagination-buttons">
                        <button class="pagination-btn">&lt;</button>
                        <button class="pagination-btn">&gt;</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Abrir modal
       document.querySelector('.search-btn').addEventListener('click', function() {
           document.getElementById('createUserModal').style.display = 'flex';
       });
   
       // Cerrar modal
       function closeModal() {
           document.getElementById('createUserModal').style.display = 'none';
       }

       // Cerrar modal al hacer clic fuera de él
       window.addEventListener('click', function(event) {
            if (event.target === createUserModal) {
                createUserModal.style.display = 'none';
            }
        });
    </script>

    <script type="module" src="../scripts/CosasComunes.js"></script>

    <script type="module">
        import { initializeRoomResume } from '../scripts/consumibles.js';
        document.addEventListener('DOMContentLoaded', initializeRoomResume);
    </script>
</body>
</html>
