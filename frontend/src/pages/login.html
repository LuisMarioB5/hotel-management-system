<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hotel Hodelpa</title>
    <link rel="shortcut icon" href="../../public/assets/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../styles/login.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Aplicar el tema guardado lo antes posible para que el fondo coincida
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>

<body>
    <div id="root">
        <div class="bubbles" aria-hidden="true">
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
            <span class="bubble"></span>
        </div>
        <div class="login-container">
            <div class="login-hotel-img-section">
                <img src="../../public/assets/login-img.jpg" alt="Fachada del Hotel Hodelpa" class="login-hotel-img">
                <div class="login-hotel-img-overlay">
                    <span class="login-hotel-img-brand">HODELPA</span>
                    <span class="login-hotel-img-tagline">Sistema de gestión hotelera</span>
                </div>
            </div>
            <div class="login-form-section">
                <div class="login-badge" aria-hidden="true"><i class="fas fa-concierge-bell"></i></div>
                <h1 class="login-h1">Bienvenido de nuevo</h1>
                <p class="login-subtitle">Inicia sesión para gestionar tu hotel</p>

                <form novalidate>
                    <div class="login-field">
                        <label for="username">Usuario</label>
                        <div class="login-input-wrap">
                            <i class="fas fa-user login-input-icon" aria-hidden="true"></i>
                            <input type="text" id="username" placeholder="Tu nombre de usuario" autocomplete="username" required>
                        </div>
                    </div>

                    <div class="login-field">
                        <label for="password">Contraseña</label>
                        <div class="login-input-wrap">
                            <i class="fas fa-lock login-input-icon" aria-hidden="true"></i>
                            <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password" required>
                            <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña" aria-pressed="false">
                                <i class="fas fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>

                    <button type="submit" class="login-submit">
                        <span class="login-submit-label">Ingresar</span>
                        <i class="fas fa-arrow-right-long login-submit-icon" aria-hidden="true"></i>
                        <span class="login-submit-spinner" aria-hidden="true"></span>
                    </button>
                </form>

                <p class="login-footer">Todos los derechos reservados &copy;</p>
            </div>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const toggleIcon = togglePassword.querySelector('i');

        togglePassword.addEventListener('click', () => {
            // Alternar el tipo de input entre "password" y "text"
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';

            // Cambiar el icono y el estado accesible según corresponda
            toggleIcon.classList.toggle('fa-eye', !isPassword);
            toggleIcon.classList.toggle('fa-eye-slash', isPassword);
            togglePassword.setAttribute('aria-pressed', String(isPassword));
            togglePassword.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
        });
    </script>

    <script type="module" src="../scripts/login-for-now.js"></script>
</body>
</html>
