<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hotel Hodelpa</title>
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="shortcut icon" href="../../public/assets/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div id="root">
        <div class="login-container">
            <div class="login-hotel-img-section">
                <img src="../../public/assets/login-img.jpeg" alt="hodelpa Logo" class="login-hotel-img">
            </div>
            <div class="login-form-section">
                <h1 class="login-h1">Bienvenido</h1>
                <form>
                    <input type="text" id="username" placeholder="Nombre de usuario" required>
                    <input type="password" id="password" placeholder="•••••••••" required>
                    <button type="submit">Ingresar</button>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </form>
                <p>Todos los derechos reservados &copy;</p>
            </div>
        </div>
    </div>

    <script type="module" src="../scripts/login-for-now.js"></script>
</body>
</html>
