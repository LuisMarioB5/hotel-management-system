<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión - Salida | Hotel Hodelpa</title>
    <link rel="shortcut icon" href="../../public/assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../styles/dashboard.css">
    <link rel="stylesheet" href="../styles/recepcion.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="dashboard-page">
        <div class="dashboard-container">
            <div class="main-content">
                <div class="user-info">
                    <div id="logoutButton" class="profile-card" role="button" tabindex="0">
                        <i class="fas fa-user"></i>
                        <span class="profile-name">Admin</span>
                        <i class="fas profile-role-icon"></i>
                        <i class="fas fa-chevron-down profile-chevron"></i>
                    </div>
                </div>
                <div class="page-title-card">
                    <h2>Salida</h2>
                </div>
    
                <div class="rooms-container">
                    <label>Seleccionar Piso</label>
                    <select class="floor-selector">
                        <option value="Todos">Todos</option>
                        <option value="PRIMER">PRIMER</option>
                        <option value="SEGUNDO">SEGUNDO</option>
                        <option value="TERCER">TERCER</option>
                        <option value="CUARTO">CUARTO</option>
                        <option value="QUINTO">QUINTO</option>
                    </select>
                    <div class="rooms-grid">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Logout -->
    <div class="modal" id="logoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5>¿Estás seguro de que deseas salir?</h5>
                <span class="close-button" id="closeModal">&times;</span>
            </div>
            <div class="modal-body">
                Presiona "Cerrar sesión" si estás listo para terminar tu sesión actual.
            </div>
            <div class="modal-footer">
                <button class="btn cancel" id="cancelLogout">Cancelar</button>
                <a href="../pages/login.html" class="btn logout">Cerrar sesión</a>
            </div>
        </div>
    </div>

    <script type="module" src="../scripts/CosasComunes.js"></script>
   
    <script type="module">
        import { initializeCheckOutPage } from '../scripts/booking.js';
        document.addEventListener('DOMContentLoaded', initializeCheckOutPage);
    </script>
</body>
</html>
