<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recepción | Habitación | Hotel Hodelpa</title>
    <link rel="shortcut icon" href="../../public/assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../styles/dashboard.css">
    <link rel="stylesheet" href="../styles/G_recepcion_ocup_dispo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script defer src="https://kit.fontawesome.com/a076d05399.js"></script>
</head>
<body>
    <div class="dashboard-page">
        <div class="dashboard-container">
            <div class="main-content">
                <div class="user-info">
                    <button id="logoutButton">Admin <i class="fas fa-user"></i></button>
                </div>
                <!-- Resumen de la Habitación -->
                <div class="info-card">
                    <h2><i class="fas fa-bed"></i> Resumen de la Habitación</h2>
                    <div class="info-grid">
                        <div class="info-group">
                            <label><i class="fas fa-hashtag"></i> Habitacion:</label>
                            <input type="text" id="roomNumber" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-list"></i> Detalles:</label>
                            <input type="text" id="roomDetails" readonly>
                        </div>        
                        <div class="info-group">
                            <label><i class="fas fa-tag"></i> Categoría:</label>
                            <input type="text" id="roomCategory" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-building"></i> Piso:</label>
                            <input type="text" id="roomFloor" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-user"></i> Cliente:</label>
                            <input type="text" id="clientName" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-id-card"></i> Nro Documento:</label>
                            <input type="text" id="nroDocumento" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-envelope"></i> Correo:</label>
                            <input type="email" id="correo" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-calendar-plus"></i> Fecha Entrada:</label>
                            <input type="date" id="fechaEntrada" readonly>
                        </div>
                    </div>
                </div>
                <!-- Detalle de Hospedaje -->
                <div class="info-card">
                    <h2><i class="fas fa-concierge-bell"></i> Detalle de Hospedaje</h2>
                    <div class="info-grid">
                        <div class="info-group">
                            <label><i class="fas fa-dollar-sign"></i> Costo Total Habitacion:</label>
                            <input type="text" id="roomCost" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-money-bill-wave"></i> Cantidad Adelanto:</label>
                            <input type="text" id="cashAdvance" readonly>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-money-bill"></i> Cantidad Restante:</label>
                            <input type="text" id="remainingAmount" readonly>
                        </div>
                    
                        <div class="info-group">
                            <label><i class="fas fa-calendar-minus"></i> Fecha Salida:</label>  
                            <div class="date-container">
                                <input class="icon-date" type="date" id="fechaSalida" required>
                                <button class="postpone-btn"><i class="fas fa-clock"></i> Aplazar</button>
                            </div>
                        </div>
                        <div class="info-group">
                            <label><i class="fas fa-list"></i> Detalles:</label>
                            <input type="text" id="bookingDetails" readonly>
                        </div> 
                    </div>     
                </div>
                 <!-- Servicio a la Habitación -->
                <div class="info-card">
                    <h2><i class="fas fa-bell"></i> Servicio a la Habitación</h2>
                    <div class="table-container">
                        <table class="service-table">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Cantidad</th>
                                    <th>Precio Unitario</th>
                                    <th>Estado Venta</th>
                                    <th>Sub Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Jugo</td>
                                    <td>1</td>
                                    <td>$30</td>
                                    <td><label>Pendiente</label></td>
                                    <td>$35</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Logout -->
    <div class="modal" id="logoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5>¿Estás seguro de que deseas salir?</h5>
                <span class="close-button" id="closeModal">&times;</span>
            </div>
            <div class="modal-body">
                Presiona "Cerrar sesión" si estás listo para terminar tu sesión actual.
            </div>
            <div class="modal-footer">
                <button class="btn cancel" id="cancelLogout">Cancelar</button>
                <a href="../pages/login.html" class="btn logout">Cerrar sesión</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // Establecer la fecha de entrada como la fecha actual
            const fechaSalida = document.getElementById('fechaSalida');
            
            // Set min date for checkout to be today
            const today = new Date().toISOString().split('T')[0];
            fechaSalida.setAttribute('min', today);
            
            // Update min date for checkout when check-in date changes
            fechaEntrada.addEventListener('change', function() {
                fechaSalida.setAttribute('min', this.value);
                if(fechaSalida.value && fechaSalida.value < this.value) {
                    fechaSalida.value = this.value;
                }
            });
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
        const searchBtn = document.querySelector('.search-btn');
        const clientListModal = document.getElementById('clientListModal');
        const closeClientList = document.getElementById('closeClientList');

        // Abrir modal al hacer clic en el botón de búsqueda
        searchBtn.addEventListener('click', function() {
            clientListModal.style.display = 'block';
        });

        // Cerrar modal
        closeClientList.addEventListener('click', function() {
            clientListModal.style.display = 'none';
        });

        // Cerrar modal al hacer clic fuera de él
        window.addEventListener('click', function(event) {
            if (event.target === clientListModal) {
                clientListModal.style.display = 'none';
            }
        });
    });   
    </script>
    
    <script type="module" src="../scripts/CosasComunes.js" type="module"></script>
</body>
</html>
