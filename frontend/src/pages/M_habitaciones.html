<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Hodelpa | Habitaciones</title>
  <link rel="stylesheet" href="../styles/dashboard.css">
  <link rel="stylesheet" href="../styles/usuarios.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script defer src="https://kit.fontawesome.com/a076d05399.js"></script>
  <script type="module" src="../auth/pages/maintenance.auth.js"></script>
</head>
<body>
    <div class="dashboard-page">
        <div class="dashboard-container">
            

            <div class="main-content">
                <div class="user-info">
                    <button id="logoutButton">Admin <i class="fas fa-user"></i></button>
                </div>
                <div class="contenido">
                    <div class="user-list-header">
                        <h2>Lista de Habitaciones</h2>
                    </div>
                 
                    <!-- Botón "Crear Nuevo" y opciones de visualización -->
                    <div class="user-actions">
                        <div class="table-controls">
                            <label for="recordsPerPage">Mostrar:</label>
                            <select id="recordsPerPage">
                                <option value="All">Todos</option>
                                <option value="5">5</option>
                                <option value="10">10</option>
                            </select>
                            <label>Registros: </label>
                            <input type="text" id="searchUser" placeholder="Buscar habitacion">
                        </div>
                    </div>

                    <!-- Tabla de Habitaciones -->
                    <div class="user-table">
                        <table id="roomTable">
                            <thead>
                                <tr>
                                    <th>Numero</th>
                                    <th>Detalle</th>
                                    <th>Piso</th>
                                    <th>Categoria</th>
                                    <th>Disponibilidad</th>
                                    <th>Precio</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Los datos se cargarán dinámicamente aquí -->
                            </tbody>
                        </table>
                        <!-- Div de paginación y conteo de registros -->
                        <div class="pagination-info">
                            <label></label>
                                <div class="pagination-buttons">
                                    <button class="pagination-btn">&lt;</button>
                                    <button class="pagination-btn">&gt;</button>
                                </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para modificar Usuario -->
    <div id="createUserModal" class="modalusu">
        <div class="modalusu-content">
            <div class="modalusu-header">   
                <h2>Editar Habitacion</h2>
                <span class="close-buttonusu" onclick="closeModal()">&times;</span>
            </div>
            <div class="modalusu-body">
                <label for="numero">Numero</label>
                <input type="text" id="numero" required>

                <label for="detalle">Detalle</label>
                <input type="text" id="detalle" required>

                <label for="piso">Piso</label>
                <select id="piso">
                    <option value="PRIMER">PRIMER</option>
                    <option value="SEGUNDO">SEGUNDO</option>
                    <option value="TERCER">TERCER</option>
                    <option value="CUARTO">CUARTO</option>
                    <option value="QUINTO">QUINTO</option>
                </select>

                <label for="categoria">Categoria</label>
                <select id="categoria">
                    <option value="INDIVIDUAL">INDIVIDUAL</option>
                    <option value="DOBLE">DOBLE</option>
                    <option value="TRIPLE">TRIPLE</option>
                    <option value="MATRIMONIAL">MATRIMONIAL</option>
                </select>
                
                <label for="Disponibilidad">Disponibilidad</label>
                <select id="Disponibilidad">
                    <option value="DISPONIBLE">DISPONIBLE</option>
                    <option value="FUERA_DE_SERVICIO">FUERA DE SERVICIO</option>
                    <option value="OCUPADA">OCUPADA</option>
                    <option value="LIMPIEZA">LIMPIEZA</option>
                </select>

                <label for="precio">Precio</label>
                <input type="text" id="precio" required>

                <label for="estado">Estado</label>
                <select id="estado">
                    <option value="Activo">Activo</option>
                    <option value="Inactivo">Inactivo</option>
                </select>
            </div>
            <div class="modalusu-footer">
                <button class="btn_cancelusu" onclick="closeModal()">Cerrar</button>
                <button class="btn_saveusu" onclick="guardarHabitacion()">Guardar</button>
            </div>
        </div>
    </div>
    
     <!-- Modal de Logout -->
     <div class="modal" id="logoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5>¿Estás seguro de que deseas salir?</h5>
                <span class="close-button" id="closeModal">&times;</span>
            </div>
            <div class="modal-body">
                Presiona "Cerrar sesión" si estás listo para terminar tu sesión actual.
            </div>
            <div class="modal-footer">
                <button class="btn cancel" id="cancelLogout">Cancelar</button>
                <a href="../pages/login.html" class="btn logout">Cerrar sesión</a>
            </div>
        </div>
    </div>

<script>
     // Abrir modal
    document.querySelector('.edit-btn').addEventListener('click', function() {
        document.getElementById('createUserModal').style.display = 'flex';
    });

    // Cerrar modal y limpiar campos
    function closeModal() {
        document.getElementById('createUserModal').style.display = 'none';
        limpiarCampos();
    }

    // Función para limpiar los campos del modal
    function limpiarCampos() {
        document.getElementById('numero').value = '';
        document.getElementById('detalle').value = '';
        document.getElementById('precio').value = '';
        document.getElementById('categoria').selectedIndex = 0;
        document.getElementById('piso').selectedIndex = 0;
        document.getElementById('estado').selectedIndex = 0;
    }

    function guardarHabitacion() {
        // Obtener los valores de los campos
    const numero = document.getElementById('numero').value.trim();
    const detalle = document.getElementById('detalle').value.trim();
    const precio = document.getElementById('precio').value.trim();
    const categoria = document.getElementById('categoria').value;
    const piso = document.getElementById('piso').value;
    const estado = document.getElementById('estado').value;

    // Validar los campos
    let mensajeError = '';

    if (!numero) {
        mensajeError += 'El campo Número es obligatorio.\n';
    } else if (!/^\d+$/.test(numero)) {
        mensajeError += 'El Número debe contener solo números.\n';
    }

    if (!detalle) {
        mensajeError += 'El campo Detalle es obligatorio.\n';
    } else if (!/^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/.test(detalle)) {
        mensajeError += 'El Detalle solo debe contener letras.\n';
    }

    if (!precio) {
        mensajeError += 'El campo Precio es obligatorio.\n';
    } else if (!/^\d+(\.\d{1,2})?$/.test(precio) || parseFloat(precio) <= 0) {
        mensajeError += 'El Precio debe ser un número positivo con hasta dos decimales.\n';
    }

    // Si hay errores, mostrar el mensaje de error
    if (mensajeError) {
        alert(mensajeError);
    } else {
        // Si todos los campos son válidos, guardar la habitación
        alert("Habitación guardada con éxito.");
        closeModal();
    }
    }
</script>

<script src="../scripts/CosasComunes.js" type="module"></script>
<script src="../scripts/habitacion.js" type="module"></script>
</body>
</html>
