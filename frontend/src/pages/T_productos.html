<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Hodelpa | Productos</title>
  <link rel="stylesheet" href="../styles/dashboard.css">
  <link rel="stylesheet" href="../styles/usuarios.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.all.min.js"></script>
<script defer src="https://kit.fontawesome.com/a076d05399.js"></script>
</head>
<body>
    <div class="dashboard-page">
        <div class="dashboard-container">
            
            <div class="main-content">
                <div class="user-info">
                    <button id="logoutButton">Admin <i class="fas fa-user"></i></button>
                </div>
                <div class="user-list-header">
                    <h2>Lista de Productos</h2>
                </div>
                <div class="contenido"> 
                    <!-- Botón "Crear Nuevo" y opciones de visualización -->
                    <div class="user-actions">
                        <button class="create-button" data-toggle="modal" data-target="#createUserModal">
                            <i class="fas fa-cart-plus"></i>  Nuevo
                        </button>
                        
                        <div class="table-controls">
                            <label for="recordsPerPage">Mostrar:</label>
                            <select id="recordsPerPage">
                                <option value="All">Todos</option>
                                <option value="5">5</option>
                                <option value="10">10</option>
                            </select>
                            <label>Registros:</label>
                            <input type="text" id="searchUser" placeholder="Buscar producto">
                        </div>
                    </div>

                    <!-- Tabla de Usuarios -->
                    <div class="user-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Detalle</th>
                                    <th>Categoria</th>
                                    <th>Precio</th>
                                    <th>Cantidad</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                
                            </tbody>
                        </table>
                        <!-- Div de paginación y conteo de registros -->
                        <div class="pagination-info">
                            <label></label>
                                <div class="pagination-buttons">
                                    <button class="pagination-btn">&lt;</button>
                                    <button class="pagination-btn">&gt;</button>
                                </div>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    

    <!-- Modal para Crear Producto -->
    <div id="createUserModal" class="modalusu">
        <div class="modalusu-content">
            <div class="modalusu-header">
                <h2>Producto</h2>
                <span class="close-buttonusu" onclick="closeModal()">&times;</span>
            </div>
            <div class="modalusu-body">

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" required>

                <label for="detalle">Detalle</label>
                <input type="text" id="detalle" required>

                <label for="categoria">Categoria</label>
                <select id="categoria">
                    <option value="SERVICIO">Servicio</option>
                    <option value="PRODUCTO">Producto</option>
                </select>

                <label for="precio">Precio</label>
                <input type="text" id="precio" required>

                <label for="cantidad">Cantidad</label>
                <input type="text" id="cantidad" required>

                <label for="estado">Estado</label>
                <select id="estado">
                    <option value="Activo">Activo</option>
                    <option value="Inactivo">Inactivo</option>
                </select>
            </div>
            <div class="modalusu-footer">
                <button class="btn_cancelusu" onclick="closeModal()">Cerrar</button>
                <button class="btn_saveusu" onclick="guardarProducto()">Guardar</button>
            </div>
        </div>
    </div>

     <!-- Modal de Logout -->
     <div class="modal" id="logoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5>¿Estás seguro de que deseas salir?</h5>
                <span class="close-button" id="closeModal">&times;</span>
            </div>
            <div class="modal-body">
                Presiona "Cerrar sesión" si estás listo para terminar tu sesión actual.
            </div>
            <div class="modal-footer">
                <button class="btn cancel" id="cancelLogout">Cancelar</button>
                <a href="../pages/login.html" class="btn logout">Cerrar sesión</a>
            </div>
        </div>
    </div>
    <script src="../scripts/CosasComunes.js" type="module"></script>
    <script src="../scripts/producto.js" type="module"></script>
</body>
</html>
