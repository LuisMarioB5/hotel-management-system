<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Hodelpa | Reservacion</title>
    <link rel="stylesheet" href="../styles/dashboard.css">
    <link rel="stylesheet" href="../styles/recepcion.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script defer src="https://kit.fontawesome.com/a076d05399.js"></script>
</head>
<body>
    <div class="dashboard-page">
            <div class="dashboard-container">

                <div class="main-content">
                    <div class="user-info">
                        <button id="logoutButton">Admin <i class="fas fa-user"></i></button>
                    </div>
                    <h2>Reservacion</h2>
                    <hr>

                    <div class="rooms-container">
                       <div class="form-row">
                        <div class="form-group">
                            <label>Seleccionar Piso</label>
                            <select id="room-number" >
                                <label>Seleccionar Piso</label>
                                <option value="Todos">Todos</option>
                                <option value="PRIMER">PRIMER</option>
                                <option value="SEGUNDO">SEGUNDO</option>
                                <option value="TERCER">TERCER</option>
                                <option value="CUARTO">CUARTO</option>
                                <option value="QUINTO">QUINTO</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="start-date"><i class="fas fa-calendar-plus" style="color: #007bff;"></i> Fecha Inicio:</label>
                            <input type="date" id="fechaEntrada" class="date-picker" placeholder="dd/mm/yyyy">
                        </div>
                        <div class="form-group">
                            <label for="end-date"><i class="fas fa-calendar-minus " style="color: #007bff;"></i> Fecha Fin:</label>
                            <input type="date" id="fechaSalida" class="date-picker" placeholder="dd/mm/yyyy">
                        </div>
                    </div>
                        <br>
                        <div class="rooms-grid">
                        </div>
                    </div>
                </div>
            </div>
    </div>

    <!-- Incluye jQuery y jQuery UI (para el selector de fecha) -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
        // Establecer la fecha actual como el mínimo para la fecha de entrada y salida
        const fechaEntrada = document.getElementById('fechaEntrada');
        const fechaSalida = document.getElementById('fechaSalida');
        const hoy = new Date().toISOString().split('T')[0];
        
        // Establecer valor y mínimo en la fecha de entrada
        fechaEntrada.value = hoy;
        fechaEntrada.setAttribute('min', hoy);

        // Establecer el mínimo en la fecha de salida
        fechaSalida.setAttribute('min', hoy);

        // Actualizar el mínimo de la fecha de salida al cambiar la fecha de entrada
        fechaEntrada.addEventListener('change', function() {
            fechaSalida.setAttribute('min', this.value);
            
            // Ajustar la fecha de salida si es anterior a la fecha de entrada
            if (fechaSalida.value && fechaSalida.value < this.value) {
                fechaSalida.value = this.value;
            }
        });
    });
    </script>

    <!-- Modal de Logout -->
    <div class="modal" id="logoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5>¿Estás seguro de que deseas salir?</h5>
                <span class="close-button" id="closeModal">&times;</span>
            </div>
            <div class="modal-body">
                Presiona "Cerrar sesión" si estás listo para terminar tu sesión actual.
            </div>
            <div class="modal-footer">
                <button class="btn cancel" id="cancelLogout">Cancelar</button>
                <a href="../pages/login.html" class="btn logout">Cerrar sesión</a>
            </div>
        </div>
    </div>

    <script src="../scripts/CosasComunes.js"></script>

    <script type="module">
        import { initializeAvailableRoomReservations } from '../scripts/booking.js';
        document.addEventListener('DOMContentLoaded', initializeAvailableRoomReservations);
    </script>
</body>
</html>
